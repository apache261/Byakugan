openapi: 3.0.3
info:
  title: Byakugan API
  version: 0.1.0
  description: >-
    Byakugan fraud detection microservice REST API for ISO 20022-style
    pacs.008 bank transfer fraud checks. Administrative UI assets and routing
    are owned by the independent dashboard container; this Go service exposes
    only API, session, documentation, and operational endpoints.
servers:
  - url: http://localhost:9095
    description: Docker Compose local server
security:
  - bearerAuth: []
  - apiKeyAuth: []
tags:
  - name: Health
  - name: Transfer Checks
  - name: Accounts
  - name: Rules
  - name: Dashboard
  - name: Notifications
  - name: Admin
  - name: Configuration
  - name: AML
paths:
  /healthz:
    get:
      tags: [Health]
      summary: Liveness check
      security: []
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
              examples:
                ok:
                  value:
                    status: ok
                    version: 0.1.0
                    build_number: "20260713010101"
  /readyz:
    get:
      tags: [Health]
      summary: Readiness check
      description: Reports database schema readiness (currently version 34), configured cache health, and aggregate AML monitoring degradation/lag without confidential identifiers.
      security: []
      responses:
        "200":
          description: Service dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
              examples:
                ready:
                  value:
                    status: ready
                    version: 0.1.0
                    build_number: "20260713010101"
        "503":
          $ref: "#/components/responses/Error"
  /metrics:
    get:
      tags: [Health]
      summary: Prometheus-style application metrics
      security: []
      responses:
        "200":
          description: Text metrics.
          content:
            text/plain:
              schema:
                type: string
  /admin/session:
    get:
      tags: [Admin]
      summary: Check admin dashboard session
      security: []
      description: Internal/private address only. Returns whether the admin session cookie is authenticated.
      responses:
        "200":
          description: Session status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated:
                    type: boolean
                  username:
                    type: string
                    description: Authenticated administrator username; empty when unauthenticated.
                  role:
                    type: string
                    description: Authenticated administrator role; empty when unauthenticated.
                  modules:
                    type: array
                    items:
                      type: string
                    description: Dashboard modules assigned to the authenticated administrator.
  /admin/login:
    post:
      tags: [Admin]
      summary: Log in to the admin dashboard
      security: []
      description: Internal/private address only. Sets an HTTP-only, SameSite=Strict admin session cookie. Production HTTPS deployments enable its Secure attribute with ADMIN_SESSION_COOKIE_SECURE=true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
            examples:
              localAdmin:
                value:
                  username: admin
                  password: admin
      responses:
        "200":
          description: Authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/Error"
  /admin/logout:
    post:
      tags: [Admin]
      summary: Log out of the admin dashboard
      security: []
      description: Clears the admin session cookie.
      responses:
        "200":
          description: Logged out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
  /v1/simulator/metadata:
    get:
      tags: [Dashboard]
      summary: Get non-production simulator scenarios
      description: Available only when ENABLE_SIMULATOR=true. Returns server-owned scenario labels and transfer templates for the standalone dashboard simulator.
      responses:
        "200":
          description: Simulator metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulatorMetadata"
        "404":
          description: Simulator is disabled.
  /v1/transfer-checks:
    get:
      tags: [Transfer Checks]
      summary: List transfer checks
      description: Paginated investigation list with decision, text, date, score, and amount filters.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
        - in: query
          name: page_size
          schema:
            type: integer
            default: 25
            minimum: 1
            maximum: 100
        - in: query
          name: limit
          description: Maximum number of recent checks loaded before filtering.
          schema:
            type: integer
            default: 10000
            maximum: 50000
        - in: query
          name: decision
          schema:
            type: string
            enum: [all, allow, review, block]
        - in: query
          name: q
          schema:
            type: string
          description: Searches IDs, account IDs, message IDs, instruction IDs, BICFI values, reasons, and rule hit text.
        - in: query
          name: date_from
          schema:
            type: string
            description: RFC3339 timestamp or YYYY-MM-DD date.
        - in: query
          name: date_to
          schema:
            type: string
            description: RFC3339 timestamp or YYYY-MM-DD date.
        - in: query
          name: min_score
          schema:
            type: number
        - in: query
          name: max_score
          schema:
            type: number
        - in: query
          name: min_amount
          schema:
            type: number
        - in: query
          name: max_amount
          schema:
            type: number
      responses:
        "200":
          description: Paginated transfer checks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedTransferChecks"
    post:
      tags: [Transfer Checks]
      summary: Check a pacs.008 transfer for fraud
      description: Accepts canonical JSON mapped to ISO 20022 pacs.008 concepts and returns a synchronous decision.
      parameters:
        - in: header
          name: Idempotency-Key
          description: Optional client key. Reusing the same key with the same payload returns the original result; reusing it with a different payload is flagged by the duplicate idempotency rule and normally returns review.
          schema:
            type: string
          required: false
          example: sample-transfer-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferCheckRequest"
            examples:
              pacs008Transfer:
                $ref: "#/components/examples/Pacs008TransferCheckRequest"
              invalidTransfer:
                $ref: "#/components/examples/InvalidTransferCheckRequest"
      responses:
        "201":
          description: Fraud decision created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferCheck"
              examples:
                allow:
                  $ref: "#/components/examples/TransferCheckAllowResponse"
                review:
                  $ref: "#/components/examples/TransferCheckReviewResponse"
                block:
                  $ref: "#/components/examples/TransferCheckBlockResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/transfer-checks/export:
    get:
      tags: [Transfer Checks]
      summary: Export transfer checks
      description: Exports the same filtered transfer-check set as the list endpoint. Use `format=json` for a structured export or `format=csv` for spreadsheet-friendly investigation files.
      parameters:
        - in: query
          name: format
          schema:
            type: string
            enum: [json, csv]
            default: json
        - in: query
          name: limit
          schema:
            type: integer
            default: 10000
            maximum: 50000
        - in: query
          name: decision
          schema:
            type: string
            enum: [all, allow, review, block]
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: date_from
          schema:
            type: string
        - in: query
          name: date_to
          schema:
            type: string
        - in: query
          name: min_score
          schema:
            type: number
        - in: query
          name: max_score
          schema:
            type: number
        - in: query
          name: min_amount
          schema:
            type: number
        - in: query
          name: max_amount
          schema:
            type: number
      responses:
        "200":
          description: Transfer check export.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferCheckExport"
            text/csv:
              schema:
                type: string
  /v1/transfer-checks/iso20022:
    post:
      tags: [Transfer Checks]
      summary: Check a pacs.008 XML transfer for fraud
      description: Accepts interoperable ISO 20022 pacs.008 XML. The parser searches by XML local-name, so namespace prefixes and bank/switch wrapper names do not need to match a hardcoded layout. It maps the first CdtTrfTxInf transaction to the internal canonical transfer request and returns the same synchronous fraud decision shape as the JSON endpoint.
      parameters:
        - in: header
          name: Idempotency-Key
          description: Optional client key. Reusing the same key with the same payload returns the original result; reusing it with a different payload is flagged by the duplicate idempotency rule and normally returns review.
          schema:
            type: string
          required: false
          example: INS-XML-001
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              type: string
            examples:
              pacs008Xml:
                summary: pacs.008.001.08 XML transfer
                value: |
                  <?xml version="1.0" encoding="UTF-8"?>
                  <Document xmlns="urn:iso:std:iso:20022:tech:xsd:pacs.008.001.08">
                    <FIToFICstmrCdtTrf>
                      <GrpHdr>
                        <MsgId>MSG-XML-001</MsgId>
                        <CreDtTm>2026-07-06T09:00:00Z</CreDtTm>
                      </GrpHdr>
                      <CdtTrfTxInf>
                        <PmtId>
                          <InstrId>INS-XML-001</InstrId>
                          <EndToEndId>E2E-XML-001</EndToEndId>
                          <TxId>TX-XML-001</TxId>
                        </PmtId>
                        <IntrBkSttlmAmt Ccy="PHP">1250.50</IntrBkSttlmAmt>
                        <Dbtr><Nm>Juan Dela Cruz</Nm></Dbtr>
                        <DbtrAcct><Id><Othr><Id>debtor-xml</Id></Othr></Id></DbtrAcct>
                        <DbtrAgt><FinInstnId><BICFI>DEUTPHMM</BICFI></FinInstnId></DbtrAgt>
                        <Cdtr><Nm>Maria Santos</Nm></Cdtr>
                        <CdtrAcct><Id><Othr><Id>creditor-xml</Id></Othr></Id></CdtrAcct>
                        <CdtrAgt><FinInstnId><BICFI>BOPIPHMM</BICFI></FinInstnId></CdtrAgt>
                        <RmtInf><Ustrd>Invoice 1001</Ustrd></RmtInf>
                      </CdtTrfTxInf>
                    </FIToFICstmrCdtTrf>
                  </Document>
      responses:
        "201":
          description: Fraud decision created from XML input.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferCheck"
              examples:
                allow:
                  $ref: "#/components/examples/TransferCheckAllowResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/transfer-checks/{id}:
    get:
      tags: [Transfer Checks]
      summary: Get a transfer check
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Transfer check.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferCheck"
              examples:
                allow:
                  $ref: "#/components/examples/TransferCheckAllowResponse"
        "404":
          $ref: "#/components/responses/Error"
  /v1/payment-statuses/iso20022:
    post:
      tags: [Transfer Checks]
      summary: Receive an ISO 20022 pacs.002 XML payment status response
      description: Accepts pacs.002 through a direct ISO Document or any service-specific outer wrapper, correlates its first TxInfAndSts to an existing pacs.008 transfer check, and persists operational payment status separately from the fraud decision. Wrapper discovery uses XML local names and does not depend on an InstaPay, RTP, BancNet, or other payment-service namespace. Correlation prioritizes original transaction ID, instruction ID, end-to-end ID, clearing-system reference, then message ID. XML signatures are detected but are not cryptographically verified by this endpoint. The canonical parser is not an XSD validation engine; service-specific profile validation belongs at the ingress adapter.
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              type: string
      responses:
        "201":
          description: Payment status report stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStatusReport"
        "200":
          description: An idempotent duplicate of an existing payment status report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStatusReport"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/payment-statuses:
    get:
      tags: [Transfer Checks]
      summary: List received ISO 20022 payment status reports
      parameters:
        - in: query
          name: transfer_check_id
          schema: {type: string}
        - in: query
          name: limit
          schema: {type: integer, default: 100, maximum: 1000}
      responses:
        "200":
          description: Payment status reports, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PaymentStatusReport"
  /v1/transfer-checks/{id}/approve:
    post:
      tags: [Transfer Checks]
      summary: Approve a reviewed transfer check
      description: Changes a reviewed transfer decision to `allow` and records an audit event.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Transfer check approved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferCheck"
              examples:
                approved:
                  value:
                    id: chk-002
                    request:
                      message_type: pacs.008
                      payload:
                        message_id: MSG-20260706-003
                        creation_date_time: "2026-07-06T09:10:00Z"
                        payment_identification:
                          end_to_end_id: E2E-003
                        instructed_amount:
                          amount: 50000
                          currency: PHP
                        debtor_account:
                          id: acct-debtor-001
                        debtor_agent:
                          bicfi: DEUTPHMM
                        creditor_account:
                          id: acct-creditor-001
                        creditor_agent:
                          bicfi: BOPIPHMM
                    decision: allow
                    score: 60
                    reasons:
                      - high value transfer exceeds review threshold
                      - manually approved by fraud admin
                    rule_hits:
                      - rule_id: rule-large-php-transfer-review
                        rule_name: High Value Transfer Review
                        outcome: review
                        score_delta: 60
                        reason: high value transfer exceeds review threshold
                    created_at: "2026-07-06T09:10:01Z"
        "404":
          $ref: "#/components/responses/Error"
  /v1/accounts:
    post:
      tags: [Accounts]
      summary: Create or update an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Account"
            examples:
              account:
                $ref: "#/components/examples/AccountRequest"
      responses:
        "201":
          description: Account saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
              examples:
                account:
                  $ref: "#/components/examples/AccountResponse"
        "400":
          $ref: "#/components/responses/Error"
    get:
      tags: [Accounts]
      summary: List accounts
      responses:
        "200":
          description: Accounts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
              examples:
                accounts:
                  value:
                    - id: acct-debtor-001
                      bban: PH-DEBTOR-0001
                      name: Juan Sender
                      status: active
                      risk_tier: medium
                      metadata:
                        country: PH
                        default_currency: PHP
                      created_at: "2026-07-06T09:00:00Z"
                      updated_at: "2026-07-06T09:00:00Z"
  /v1/accounts/import:
    post:
      tags: [Accounts]
      summary: Import fraud-control accounts from CSV
      description: >-
        Accepts at most 4 MiB and 5,000 non-empty account rows. The required
        columns are id and name. Optional columns are iban, bban, status,
        risk_tier, and metadata_json. Each valid row is upserted independently
        and the response reports row-level failures without echoing account
        data.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
          text/csv:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Per-row import results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountImportResult"
        "400":
          $ref: "#/components/responses/Error"
        "413":
          description: The CSV upload exceeds the 4 MiB size limit.
        "415":
          description: Unsupported upload content type.
  /v1/accounts/{id}:
    get:
      tags: [Accounts]
      summary: Get an account
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
              examples:
                account:
                  $ref: "#/components/examples/AccountResponse"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [Accounts]
      summary: Patch an account
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountPatch"
            examples:
              patchRisk:
                value:
                  risk_tier: high
                  metadata:
                    segment: corporate
      responses:
        "200":
          description: Account updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "404":
          $ref: "#/components/responses/Error"
  /v1/accounts/{id}/block:
    post:
      tags: [Accounts]
      summary: Block an account
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Account blocked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
              examples:
                blocked:
                  value:
                    id: acct-debtor-001
                    bban: PH-DEBTOR-0001
                    name: Juan Sender
                    status: blocked
                    risk_tier: high
                    created_at: "2026-07-06T09:00:00Z"
                    updated_at: "2026-07-06T09:10:00Z"
        "404":
          $ref: "#/components/responses/Error"
  /v1/accounts/{id}/allow:
    post:
      tags: [Accounts]
      summary: Explicitly allow an account
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Account allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
  /v1/accounts/{id}/config:
    get:
      tags: [Accounts]
      summary: Get per-account fraud configuration
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Account config.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountConfig"
              examples:
                config:
                  $ref: "#/components/examples/AccountConfigResponse"
        "404":
          $ref: "#/components/responses/Error"
    put:
      tags: [Accounts]
      summary: Upsert per-account fraud configuration
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountConfig"
            examples:
              config:
                $ref: "#/components/examples/AccountConfigRequest"
      responses:
        "200":
          description: Account config saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountConfig"
              examples:
                config:
                  $ref: "#/components/examples/AccountConfigResponse"
  /v1/accounts/{id}/profile:
    get:
      tags: [Accounts]
      summary: Get rolling account behavior profile
      description: Returns a read-only profile generated from recent transfer history, including usual amounts, currencies, creditors, agents, active hours, frequency, and cold-start status.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Behavior profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BehaviorProfile"
  /v1/accounts/{id}/profile/snapshots:
    get:
      tags: [Accounts]
      summary: List auditable historical behavior-profile snapshots
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": {description: Historical snapshots stored in the audit log.}
    post:
      tags: [Accounts]
      summary: Record the current behavior profile as an audit snapshot
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "201": {description: Snapshot recorded.}
  /v1/rules:
    post:
      tags: [Rules]
      summary: Create or update a portable JSON rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Rule"
            examples:
              amountReviewRule:
                $ref: "#/components/examples/AmountReviewRuleRequest"
              routeBlockRule:
                $ref: "#/components/examples/RouteBlockRuleRequest"
      responses:
        "201":
          description: Rule saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
              examples:
                amountReviewRule:
                  $ref: "#/components/examples/AmountReviewRuleResponse"
    get:
      tags: [Rules]
      summary: List rules
      responses:
        "200":
          description: Rules.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rule"
              examples:
                rules:
                  value:
                    - id: rule-large-amount
                      name: High Value Transfer Review
                      scope: default
                      priority: 10
                      enabled: true
                      version: 1
                      definition:
                        field: amount
                        op: gte
                        value: 50000
                        outcome: review
                        score: 60
                        reason: high value transfer exceeds review threshold
                      created_at: "2026-07-06T09:00:00Z"
                      updated_at: "2026-07-06T09:00:00Z"
  /v1/rules/simulate:
    post:
      tags: [Rules]
      summary: Simulate a draft rule against a sample transfer
      description: Evaluates a rule definition without saving it, so admins can test rules before activation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleSimulationRequest"
      responses:
        "200":
          description: Simulation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleSimulationResponse"
  /v1/rules/metadata:
    get:
      tags: [Rules]
      summary: Get visual rule-builder metadata
      description: Returns the backend-owned field, operator, mode, outcome, and preset catalogs used by framework-free dashboard rule builders.
      responses:
        "200":
          description: Rule-builder metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleBuilderMetadata"
  /v1/rules/{id}:
    patch:
      tags: [Rules]
      summary: Patch a rule
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RulePatch"
            examples:
              disable:
                value:
                  enabled: false
      responses:
        "200":
          description: Rule updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "404":
          $ref: "#/components/responses/Error"
  /v1/rules/{id}/history:
    get:
      tags: [Rules]
      summary: List immutable rule revisions
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Newest-first rule revision history.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RuleRevision"
  /v1/rules/{id}/rollback:
    post:
      tags: [Rules]
      summary: Restore a previous rule revision as a new version
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Restored rule with a new monotonically increasing version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "404":
          $ref: "#/components/responses/Error"
  /v1/watchlist-entries:
