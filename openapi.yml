  /v1/aml/cases/{id}:
    get:
      tags: [AML]
      summary: Get a case with its append-only history
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses:
        "200": {description: Case and current ETag.}
        "404": {$ref: "#/components/responses/AMLProblem"}
  /v1/aml/cases/{id}/alerts:
    post:
      tags: [AML]
      summary: Link another alert to a case
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/AMLIfMatch"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [alert_id], properties: {alert_id: {type: string}}}}}}
      responses: {"200": {description: Alert linked.}, "412": {$ref: "#/components/responses/AMLProblem"}, "428": {$ref: "#/components/responses/AMLProblem"}}
  /v1/aml/cases/{id}/assign:
    post:
      tags: [AML]
      summary: Assign a case
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/AMLIfMatch"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [assignee_id], properties: {assignee_id: {type: string}, reason_code: {type: string}}}}}}
      responses: {"200": {description: Case assigned.}, "412": {$ref: "#/components/responses/AMLProblem"}, "428": {$ref: "#/components/responses/AMLProblem"}}
  /v1/aml/cases/{id}/investigate:
    post:
      tags: [AML]
      summary: Move a case into investigation
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/AMLIfMatch"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {reason_code: {type: string}}}}}}
      responses: {"200": {description: Case under investigation.}}
  /v1/aml/cases/{id}/escalate:
    post:
      tags: [AML]
      summary: Escalate a case
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/AMLIfMatch"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {reason_code: {type: string}}}}}}
      responses: {"200": {description: Case escalated.}}
  /v1/aml/cases/{id}/close:
    post:
      tags: [AML]
      summary: Close a case with a disposition and rationale
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/AMLIfMatch"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [disposition, rationale], properties: {disposition: {type: string, enum: [suspicious, no_suspicion, inconclusive]}, rationale: {type: string}, reason_code: {type: string}}}}}}
      responses: {"200": {description: Case closed.}}
  /v1/aml/cases/{id}/reopen:
    post:
      tags: [AML]
      summary: Reopen a closed case
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/AMLIfMatch"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {reason_code: {type: string}}}}}}
      responses: {"200": {description: Case reopened.}}
  /v1/aml/cases/{id}/notes:
    get:
      tags: [AML]
      summary: List immutable case notes
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses: {"200": {description: Case notes.}}
    post:
      tags: [AML]
      summary: Append a case note
      parameters: [{$ref: "#/components/parameters/ID"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [body], properties: {body: {type: string, maxLength: 10000}}}}}}
      responses: {"201": {description: Note appended.}}
  /v1/aml/cases/{id}/attachments:
    get:
      tags: [AML]
      summary: List protected attachment metadata
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses: {"200": {description: Attachment metadata; storage keys are never returned.}}
    post:
      tags: [AML]
      summary: Upload a protected case attachment
      description: Maximum 10 MiB. Requires `aml:investigate`; blob bytes are stored outside the relational database.
      parameters: [{$ref: "#/components/parameters/ID"}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {type: object, required: [attachment], properties: {attachment: {type: string, format: binary}}}
      responses: {"201": {description: Attachment metadata created.}, "400": {$ref: "#/components/responses/AMLProblem"}}
  /v1/aml/cases/{id}/attachments/{attachment_id}:
    get:
      tags: [AML]
      summary: Download a verified protected attachment
      parameters:
        - {$ref: "#/components/parameters/ID"}
        - {name: attachment_id, in: path, required: true, schema: {type: string}}
      responses: {"200": {description: Attachment bytes with SHA-256 response header.}, "404": {$ref: "#/components/responses/AMLProblem"}}
  /v1/aml/cases/{id}/evidence:
    get:
      tags: [AML]
      summary: Export deterministic case evidence ZIP
      description: Includes immutable manifest, linked alerts and transactions, and verified attachments. Requires `aml:investigate`.
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses: {"200": {description: Deterministic ZIP evidence package.}}
  /v1/aml/reports:
    get:
      tags: [AML]
      summary: List suspicious activity reports
      parameters: [{$ref: "#/components/parameters/AMLCursor"}, {$ref: "#/components/parameters/AMLLimit"}, {name: status, in: query, schema: {type: string}}, {name: case_id, in: query, schema: {type: string}}]
      responses: {"200": {description: Report page.}}
    post:
      tags: [AML]
      summary: Create report draft version 1 from a suspiciously disposed case
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AMLReportCreate"}}}}
      responses: {"201": {description: Report draft created.}, "409": {$ref: "#/components/responses/AMLProblem"}}
  /v1/aml/reports/{id}:
    get:
      tags: [AML]
      summary: Get a report head and its immutable current version
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses: {"200": {description: Report and current version.}}
  /v1/aml/reports/{id}/versions:
    post:
      tags: [AML]
      summary: Append an immutable report version and return the head to draft
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/AMLIfMatch"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [content], properties: {content: {type: object, additionalProperties: true}}}}}}
      responses: {"201": {description: Version appended.}, "412": {$ref: "#/components/responses/AMLProblem"}, "428": {$ref: "#/components/responses/AMLProblem"}}
  /v1/aml/reports/{id}/review:
    post:
      tags: [AML]
      summary: Submit a report draft for review
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/AMLIfMatch"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {reason_code: {type: string}}}}}}
      responses: {"200": {description: Report submitted.}}
  /v1/aml/reports/{id}/approve:
    post:
      tags: [AML]
      summary: Approve the current immutable report version
      description: Requires `aml:approve`, an interactive supervisor session, and an approver different from the version author.
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/AMLIfMatch"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {reason_code: {type: string}}}}}}
      responses: {"200": {description: Report approved.}, "403": {$ref: "#/components/responses/AMLProblem"}, "409": {$ref: "#/components/responses/AMLProblem"}}
  /v1/aml/reports/{id}/withdraw:
    post:
      tags: [AML]
      summary: Withdraw an approved or exported report
      description: Requires `aml:approve` and an interactive supervisor session.
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/AMLIfMatch"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [reason_code], properties: {reason_code: {type: string}}}}}}
      responses: {"200": {description: Report withdrawn.}, "403": {$ref: "#/components/responses/AMLProblem"}}
  /v1/aml/reports/{id}/export:
    post:
      tags: [AML]
      summary: Export deterministic approved report bytes
      description: Requires `aml:approve` and an interactive `aml_supervisor` or `super_admin` session; API keys are rejected.
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/AMLIfMatch"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [format], properties: {format: {type: string, enum: [json, zip]}}}}}}
      responses: {"200": {description: Deterministic report attachment.}, "403": {$ref: "#/components/responses/AMLProblem"}, "412": {$ref: "#/components/responses/AMLProblem"}, "428": {$ref: "#/components/responses/AMLProblem"}}
  /v1/aml/legal-holds:
    get:
      tags: [AML]
      summary: List legal holds
      description: Requires `aml:admin`.
      parameters: [{name: status, in: query, schema: {type: string, enum: [active, released]}}]
      responses: {"200": {description: Legal holds.}}
    post:
      tags: [AML]
      summary: Create an auditable legal hold
      description: Requires `aml:admin`; targets are validated before creation.
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AMLLegalHoldCreate"}}}}
      responses: {"201": {description: Legal hold created.}, "404": {$ref: "#/components/responses/AMLProblem"}}
  /v1/aml/legal-holds/{id}:
    get:
      tags: [AML]
      summary: Get a legal hold and its immutable history
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses: {"200": {description: Legal hold.}}
  /v1/aml/legal-holds/{id}/release:
    post:
      tags: [AML]
      summary: Release a legal hold with a required reason
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/AMLIfMatch"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [reason], properties: {reason: {type: string}}}}}}
      responses: {"200": {description: Legal hold released.}, "412": {$ref: "#/components/responses/AMLProblem"}, "428": {$ref: "#/components/responses/AMLProblem"}}
  /v1/aml/retention/preview:
    post:
      tags: [AML]
      summary: Preview graph-aware AML retention impact
      description: Requires `aml:admin`; returns hold dependency paths and a short-lived actor-bound preview token.
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AMLRetentionRequest"}}}}
      responses: {"200": {description: Retention impact and preview token.}}
  /v1/aml/retention/purge:
    post:
      tags: [AML]
      summary: Execute a previously previewed AML retention purge
      description: Requires `aml:admin` and an interactive `aml_admin` or `super_admin` session; active direct and transitive holds remain preserved.
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AMLRetentionRequest"}}}}
      responses: {"200": {description: Purged and blocked counts.}, "428": {$ref: "#/components/responses/AMLProblem"}}
  /v1/aml/mapping-profiles:
    get:
      tags: [AML]
      summary: List immutable import mapping profiles
      responses: {"200": {description: Mapping profile list.}}
    post:
      tags: [AML]
      summary: Create an import mapping profile
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AMLMappingProfileCommand"}}}}
      responses: {"201": {description: Mapping profile created.}, "400": {$ref: "#/components/responses/AMLProblem"}}
  /v1/aml/mapping-profiles/{id}:
    get:
      tags: [AML]
      summary: Get a mapping profile and immutable versions
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses: {"200": {description: Mapping profile.}, "404": {$ref: "#/components/responses/AMLProblem"}}
  /v1/aml/mapping-profiles/{id}/versions:
    post:
      tags: [AML]
      summary: Append an immutable mapping version
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/AMLIfMatch"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AMLMappingProfileCommand"}}}}
      responses: {"201": {description: Mapping version created.}, "412": {$ref: "#/components/responses/AMLProblem"}}
  /v1/aml/imports:
    get:
      tags: [AML]
      summary: List AML imports
      responses: {"200": {description: Import list.}}
    post:
      tags: [AML]
      summary: Stream a protected source file and create an AML import
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, source_system, entity_type, format, mapping_profile_id]
              properties:
                file: {type: string, format: binary}
                source_system: {type: string, maxLength: 100}
                entity_type: {type: string, enum: [customer, customer_snapshot, account, account_profile, beneficial_owner, related_party, relationship, transaction, internal_watchlist, screening_result, legacy_alert, legacy_case]}
                format: {type: string, enum: [csv, json, ndjson, pacs008]}
                mapping_profile_id: {type: string}
                monitoring_mode: {type: string, enum: [suppressed, eligible], default: suppressed}
      responses: {"201": {description: Import uploaded.}, "400": {$ref: "#/components/responses/AMLProblem"}}
  /v1/aml/imports/{id}:
    get:
      tags: [AML]
      summary: Get import state, checkpoint, and reconciliation
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses: {"200": {description: Import.}, "404": {$ref: "#/components/responses/AMLProblem"}}
  /v1/aml/imports/options:
    get:
      tags: [AML]
      summary: Get API-owned import choices and hard limits
      responses: {"200": {description: Import option registry.}}
  /v1/aml/imports/{id}/validate:
    post:
      tags: [AML]
      summary: Dry-run validate an import without business-record mutation
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/AMLIfMatch"}]
      responses: {"200": {description: Validation classification.}, "412": {$ref: "#/components/responses/AMLProblem"}}
  /v1/aml/imports/{id}/commit:
    post:
      tags: [AML]
      summary: Commit the validated hash-bound record set
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/AMLIfMatch"}, {$ref: "#/components/parameters/AMLIdempotencyKey"}]
      responses: {"200": {description: Import committed.}, "409": {$ref: "#/components/responses/AMLProblem"}}
  /v1/aml/imports/{id}/retry:
    post:
      tags: [AML]
      summary: Upload corrected quarantined records and retain retry lineage
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/AMLIfMatch"}]
      requestBody: {required: true, content: {multipart/form-data: {schema: {type: object, required: [file], properties: {file: {type: string, format: binary}}}}}}
      responses: {"200": {description: Import revalidated.}}
  /v1/aml/imports/{id}/cancel:
    post:
      tags: [AML]
      summary: Cooperatively cancel an import
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/AMLIfMatch"}]
      responses: {"200": {description: Import cancelled.}}
  /v1/aml/imports/{id}/monitor:
    post:
      tags: [AML]
      summary: Estimate or authorize historical monitoring after completion
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/AMLIfMatch"}, {$ref: "#/components/parameters/AMLIdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AMLBackfillCommand"}}}}
      responses: {"200": {description: Backfill reference authorized.}, "409": {$ref: "#/components/responses/AMLProblem"}}
  /v1/aml/imports/{id}/errors:
    get:
      tags: [AML]
      summary: Export formula-safe quarantine errors
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses: {"200": {description: Quarantine CSV., content: {text/csv: {schema: {type: string}}}}}
  /v1/aml/backfills/{id}:
    get:
      tags: [AML]
      summary: Get backfill selection, progress, and reconciliation state
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses: {"200": {description: Backfill status.}, "404": {$ref: "#/components/responses/AMLProblem"}}
  /v1/aml/backfills/{id}/cancel:
    post:
      tags: [AML]
      summary: Cancel the queued or running monitoring job for a backfill
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/AMLIfMatch"}]
      responses: {"200": {description: Backfill cancelled.}, "409": {$ref: "#/components/responses/AMLProblem"}}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Use `Authorization: Bearer dev-secret`."
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    AMLIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, maxLength: 200}
    AMLIfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted current positive resource version.
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
    AMLCursor:
      name: cursor
      in: query
      required: false
      description: Opaque, signed, filter-bound keyset cursor returned by the preceding page.
      schema:
        type: string
        maxLength: 4096
    AMLLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
      example: acct-debtor-001
  responses:
    AMLProblem:
      description: AML validation, conflict, lookup, or authorization-safe error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AMLProblem"
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            error:
              value:
                error: not found
  schemas:
    AMLMappingProfileCommand:
      type: object
      required: [name, entity_type, format, fields]
      properties:
        name: {type: string, maxLength: 200}
        entity_type: {type: string, enum: [customer, customer_snapshot, account, account_profile, beneficial_owner, related_party, relationship, transaction, internal_watchlist, screening_result, legacy_alert, legacy_case]}
        format: {type: string, enum: [csv, json, ndjson, pacs008]}
        fields: {type: object, maxProperties: 100, additionalProperties: {type: string}}
    AMLBackfillCommand:
      type: object
      required: [window_start, window_end]
      properties:
        window_start: {type: string, format: date-time}
        window_end: {type: string, format: date-time}
        scenario_versions: {type: array, maxItems: 100, items: {type: object, required: [scenario_id, scenario_version], properties: {scenario_id: {type: string}, scenario_version: {type: integer, minimum: 1}}}}
        policy_pack_id: {type: string}
        dry_run: {type: boolean, default: false}
        rate_per_second: {type: integer, minimum: 1, maximum: 10000, default: 100}
        concurrency: {type: integer, minimum: 1, maximum: 16, default: 1}
    AMLProblem:
      type: object
      required: [error, code, request_id]
      properties:
        error:
          type: string
        code:
          type: string
          enum: [validation_failed, not_found, source_identity_conflict, immutable_conflict, effective_interval_overlap, invalid_lineage, invalid_cursor, cursor_filter_mismatch, batch_size_invalid, version_conflict, invalid_transition, four_eyes_violation, legal_hold_conflict, interactive_session_required, precondition_required, aml_unavailable, audit_persistence_failed, internal_error]
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
    AMLCaseCreate:
      type: object
      required: [title, alert_ids]
      properties:
        title: {type: string, minLength: 1, maxLength: 300}
        alert_ids: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {type: string}}
    AMLReportCreate:
      type: object
      required: [case_id, content]
      properties:
        case_id: {type: string}
        content: {type: object, additionalProperties: true}
    AMLLegalHoldCreate:
      type: object
      required: [target, reason, authority_reference]
      properties:
        target:
          type: object
          required: [type, id]
          properties:
            type: {type: string, enum: [customer, account, transaction, alert, case, report, evidence]}
            id: {type: string}
        reason: {type: string}
        authority_reference: {type: string}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
    AMLRetentionRequest:
      type: object
      required: [before]
      properties:
        before: {type: string, format: date-time}
        preview_token: {type: string, description: Required only for purge.}
    AMLScenarioNode:
      type: object
      description: Bounded declarative AML DSL v1 node; exactly one node family is accepted.
      properties:
        all: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/AMLScenarioNode"}}
        any: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/AMLScenarioNode"}}
        not: {$ref: "#/components/schemas/AMLScenarioNode"}
        field: {type: string}
        metric: {type: string, enum: [count, sum, distinct_count, repeated_value_count, first_seen_age, active_span]}
        network_metric: {type: string, enum: [fan_in, fan_out, shared_counterparty, circular_flow, pass_through]}
        operator: {type: string, enum: [eq, neq, in, not_in, contains, starts_with, exists, gt, gte, lt, lte]}
        value: {}
        policy_ref: {type: string}
        subject_basis: {type: string}
        window_seconds: {type: integer, minimum: 1, maximum: 31622400}
    AMLScenarioVersion:
      type: object
      required: [typology, execution_modes, subject_basis, window_seconds, late_data_behavior, condition, reason_template, severity, risk_score]
      properties:
        typology: {type: string, maxLength: 100}
        description: {type: string}
        execution_modes: {type: array, items: {type: string, enum: [realtime, scheduled, simulation]}}
        subject_basis: {type: string}
        window_seconds: {type: integer, minimum: 1, maximum: 31622400}
        late_data_behavior: {type: string, enum: [reconcile, ignore, observe]}
        condition: {$ref: "#/components/schemas/AMLScenarioNode"}
        reason_template: {type: string}
        severity: {type: string, enum: [low, medium, high, critical]}
        risk_score: {type: string, pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'}
        policy_inputs: {type: array, items: {type: string}}
        minimum_history_seconds: {type: integer, minimum: 0}
    AMLScenarioCreateCommand:
      type: object
      required: [name, version]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string}
        version: {$ref: "#/components/schemas/AMLScenarioVersion"}
    AMLScenarioSimulation:
      type: object
      required: [scenario_version, input]
      properties:
        scenario_version: {type: integer, minimum: 1}
        policy_pack_id: {type: string}
        input:
          type: object
          properties:
            transaction: {$ref: "#/components/schemas/AMLTransaction"}
            facts: {type: object, additionalProperties: true}
            metrics: {type: object, additionalProperties: {type: string}}
            policy_values: {type: object, additionalProperties: true}
            screening: {type: object, additionalProperties: {type: boolean}}
            evidence_ids: {type: array, items: {type: string}}
            late_data: {type: boolean}
    AMLPolicyPack:
      type: object
      required: [format_version, pack_id, pack_version, issuer, contract_range]
      properties:
        format_version: {type: integer, enum: [1]}
        pack_id: {type: string, maxLength: 200}
        pack_version: {type: string, maxLength: 100}
        issuer: {type: string, maxLength: 200}
        applicability: {type: object, additionalProperties: true}
        scenario_versions: {type: object, additionalProperties: {type: integer, minimum: 1}}
        datasets: {type: object, additionalProperties: true}
        dependencies: {type: object, additionalProperties: {type: string, pattern: '^[a-f0-9]{64}$'}}
        contract_range: {type: string, enum: [v1]}
        signature_algorithm: {type: string}
        signature_key_id: {type: string}
        signature: {type: string}
    AMLScreeningResult:
      type: object
      required: [subject, kind, provider, dataset_version, normalized_query, matches]
      properties:
        subject: {$ref: "#/components/schemas/AMLSubjectReference"}
        kind: {type: string, enum: [sanctions, pep, adverse_media, internal_watchlist]}
        provider: {type: string, maxLength: 200}
        dataset_version: {type: string, maxLength: 200}
        normalized_query: {type: string, maxLength: 500}
        evidence_ref: {type: string}
        matches:
          type: array
          maxItems: 100
          items:
            type: object
            required: [reference, match_type, confidence, algorithm]
            properties:
              reference: {type: string}
              match_type: {type: string}
              confidence: {type: string}
              algorithm: {type: string, enum: [exact, normalized, provider_fuzzy]}
              attributes: {type: object, additionalProperties: {type: string}}
    AMLSourceIdentity:
      type: object
      required: [source_system, external_id, source_event_at]
      properties:
        source_system:
          type: string
