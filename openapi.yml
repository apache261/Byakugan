  /v1/retention/preview:
    post:
      tags: [Configuration]
      summary: Preview all records affected by retention
      description: Internal/private super-admin endpoint. Always performs a non-destructive preview, including dependent cases, notes, attachments, rule hits, and webhook attempts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetentionPurgeRequest"
      responses:
        "200":
          description: Retention impact preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionPurgeResponse"
        "400":
          $ref: "#/components/responses/Error"
  /v1/retention/purge:
    post:
      tags: [Configuration]
      summary: Purge old persisted records
      description: Internal/private super-admin endpoint. Transactionally deletes transfer checks and dependent rule hits, cases, notes, attachments, and notification attempts, plus audit events matching their cutoff. Use the preview endpoint first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetentionPurgeRequest"
            examples:
              dryRun:
                value:
                  older_than_days: 90
                  dry_run: true
              explicitCutoffs:
                value:
                  transfer_checks_before: "2026-01-01T00:00:00Z"
                  audit_events_before: "2026-01-01T00:00:00Z"
      responses:
        "200":
          description: Retention purge result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionPurgeResponse"
              examples:
                result:
                  value:
                    dry_run: false
                    transfer_checks_before: "2026-01-01T00:00:00Z"
                    audit_events_before: "2026-01-01T00:00:00Z"
                    transfer_checks_deleted: 1200
                    audit_events_deleted: 2400
        "400":
          $ref: "#/components/responses/Error"
  /v1/aml/options:
