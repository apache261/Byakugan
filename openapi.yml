          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Webhook"
              examples:
                webhooks:
                  value:
                    - id: webhook-001
                      url: https://example.test/fraud-events
                      enabled: true
                      created_at: "2026-07-06T09:00:00Z"
                      updated_at: "2026-07-06T09:00:00Z"
    post:
      tags: [Notifications]
      summary: Register a webhook
      description: Registers an enabled webhook destination. The dispatcher triggers after matching transfer_check.decided audit events, filtered by notifications.policy.value.notify_on_decisions, which defaults to review and block. Manual approval events are sent by default through notifications.policy.value.notify_on_approvals. Confirmed fraud case closures send case.resolved_fraud so an ISO service can reject held transfers. Webhook bodies include the original transfer_check_request, the stored transfer_check, and a canonical pacs.002 status payload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Webhook"
            examples:
              webhook:
                value:
                  url: https://example.test/fraud-events
      responses:
        "201":
          description: Webhook created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
              examples:
                webhook:
                  value:
                    id: webhook-001
                    url: https://example.test/fraud-events
                    enabled: true
                    created_at: "2026-07-06T09:00:00Z"
                    updated_at: "2026-07-06T09:00:00Z"
