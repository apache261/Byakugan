      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        role:
          type: string
          enum: [viewer, analyst, operations, super_admin]
        modules:
          type: array
          items:
            type: string
        allowed_ips:
          type: array
          items:
            type: string
          description: Exact IPs, CIDR ranges, or `*` for any internal/private dashboard client. Defaults to `*`.
    AdminAccountPatchRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        role:
          type: string
          enum: [viewer, analyst, operations, super_admin]
        modules:
          type: array
          items:
            type: string
        allowed_ips:
          type: array
          items:
            type: string
          description: Exact IPs, CIDR ranges, or `*` for any internal/private dashboard client.
        active:
          type: boolean
    ConfigurationEntry:
      type: object
      required: [value]
      properties:
        key:
          type: string
          readOnly: true
        category:
          type: string
        value:
          type: object
          additionalProperties: true
        cache_ttl_seconds:
          type: integer
          minimum: 0
          description: TTL for cached config values. Use 0 to skip caching.
        updated_at:
          type: string
          format: date-time
          readOnly: true
    DropdownItem:
      type: object
      required: [group_id, code_id, label, enabled]
      properties:
        group_id:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          example: webhook_events
        code_id:
          type: string
          example: transfer_check.decided
        label:
          type: string
          example: Transfer Check Decided
        sort_order:
          type: integer
          minimum: 0
          example: 10
        enabled:
          type: boolean
          default: true
    RetentionPurgeRequest:
      type: object
      description: Provide either `older_than_days`, explicit cutoff timestamps, or both. Explicit cutoffs override the shared older-than cutoff for their record type.
      properties:
        older_than_days:
          type: integer
          minimum: 1
          description: Shared cutoff for transfer checks and audit events.
        transfer_checks_before:
          type: string
          description: RFC3339 timestamp or YYYY-MM-DD date. Transfer checks before this cutoff are deleted; rule hits are deleted with them.
        audit_events_before:
          type: string
          description: RFC3339 timestamp or YYYY-MM-DD date. Audit events before this cutoff are deleted.
        dry_run:
          type: boolean
          default: false
          description: When true, returns matching counts without deleting records.
    RetentionPurgeResponse:
      type: object
      required: [dry_run, transfer_checks_deleted, audit_events_deleted]
      properties:
        dry_run:
          type: boolean
        transfer_checks_before:
          type: string
          format: date-time
          nullable: true
        audit_events_before:
          type: string
          format: date-time
          nullable: true
        transfer_checks_deleted:
          type: integer
          format: int64
        audit_events_deleted:
          type: integer
          format: int64
        impact:
          $ref: "#/components/schemas/RetentionImpact"
    RetentionImpact:
      type: object
      properties:
        transfer_checks: {type: integer, format: int64}
        rule_hits: {type: integer, format: int64}
        audit_events: {type: integer, format: int64}
        cases: {type: integer, format: int64}
        case_notes: {type: integer, format: int64}
        case_attachments: {type: integer, format: int64}
        notification_attempts: {type: integer, format: int64}
